    <!-- Formulario para registrar una nueva habitación -->
<div class="contenedorTripleAdmin">
    <section>
        <div>
            <h3>Registrar Nueva Habitación</h3>
            <form action="php/registro.php" class="form-admin" method="post">
                <!-- NUMERO DE CLIENTE -->
                <div>
                    <label for="id_cliente">Número de Cliente:</label>
                    <input type="text" id="id_cliente" name="id_cliente" placeholder="Número">
                </div>

                <!-- NUMERO DE HABITACIONES -->
                <div>
                    <label for="numero_habitaciones">Número de habitaciones:</label>
                    <select id="numero_habitaciones" name="numero_habitaciones">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                    </select>
                </div>

                <!-- TIPO DE HABITACION -->
                <div>
                    <label for="tipo_habitacion">Tipo de habitación:</label>
                    <select id="tipo_habitacion" name="tipo_habitacion">
                        <option value="Sencilla">Sencilla</option>
                        <option value="Doble">Doble</option>
                        <option value="Suite">Suite</option>
                    </select>
                </div>

                <!-- IDENTIFICADOR DE HABITACION -->
                <div>
                    <label for="identificador_habitacion">Identificador de habitación:</label>
                    <select id="identificador_habitacion" name="identificador_habitacion">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                    </select>
                </div>

                <!-- NUMERO DE PERSONAS -->
                <div>
                    <label for="numero_personas">Número de personas:</label>
                    <select id="numero_personas" name="numero_personas">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                    </select>
                </div>

                <!-- FECHA DE RESERVACION -->
                <div>
                    <label for="fecha_reservacion">Fecha de reservación:</label>
                    <input type="date" id="fecha_reservacion" name="fecha_reservacion" value="2024-03-22">
                </div>

                <!-- BOTON RESERVAR -->
                <div>
                    <button id="id_button" type="submit">Registrar</button>
                </div>
            </form>
        </div>
    </section>


            <!-- Formulario para editar una habitación existente -->
<section id="editarHabitacion">
    <h3>Editar Habitación</h3>
    <form action="php/editarhab.php" class="form-admin" method="post">
        <!-- NUMERO DE LA HABITACIÓN A EDITAR -->
        <div>
            <label for="id_editar">Número de la habitación a editar:</label>
            <input type="text" id="id_editar" name="id_editar">
        </div>

        <!-- NUEVO TIPO DE HABITACIÓN -->
        <div>
            <label for="nuevo_tipo">Nuevo tipo de habitación:</label>
            <select id="nuevo_tipo" name="nuevo_tipo">
                <option value="Sencilla">Sencilla</option>
                <option value="Doble">Doble</option>
            </select>
        </div>

        <!-- NUEVO NÚMERO DE HABITACIÓN -->
        <div>
            <label for="nuevo_numero">Nuevo número de habitación:</label>
            <input type="text" id="nuevo_numero" name="nuevo_numero">
        </div>

        <!-- BOTÓN EDITAR -->
        <div>
            <button type="submit">Editar</button> 
        </div>
    </form>
</section>

            <!-- Formulario para eliminar una habitación -->
            
            <section id="eliminarHabitacion">
                <h3>Eliminar Habitación</h3>
                <form action="php/eliminarhab.php" class="form-admin" method="post">
                    <label for="id_eliminar">Numero de la habitación a eliminar:</label>
                        <input type="text" name="id_eliminar" id="id_eliminar">
                    <button type="submit">Eliminar</button>
                </form> 
            </section>
