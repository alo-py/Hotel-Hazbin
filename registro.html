<body>
    <header id="inicio">
        <div id="logo">
            <img src="img/HAZBIN HOTEL.png">
        </div>
        <div id="hora"></div>
    </header>

    <br><br><br>
    <!-- SECCION DE LOGIN -->
    <section id="login">
        <div class="form-content">
            <h1 id="title">Registro</h1>
            <form id="loginForm" action="php/registroCliente.php" method="post">
                <div class="input-group">
                    <!-- USUARIO -->
                    <div class="input-field" id="nameInput">
                        <i class="fa-solid fa-user"></i>
                        <input id="usuario" name="usuario" type="text" placeholder="Usuario">
                    </div>
                    <!-- EMAIL -->
                    <div class="input-field">
                        <i class="fa-solid fa-envelope"></i>
                        <input id="email" name="correo" type="email" placeholder="Correo">
                    </div>
                    <!-- CONTRASEÑA -->
                    <div class="input-field">
                        <i class="fa-solid fa-lock"></i>
                        <input id="contraseña" name="contraseña" type="password" placeholder="Contraseña">
                    </div>
                    <!-- <p id="pRegistro">¿Olvidaste tu contraseña? <a id="aRegistro" href="registro.html">Haz click aquí.</a>.</p> -->
                    <p>¿Tienes una cuenta?<a onclick="window.location.href='login.html'" style="cursor: pointer;">Haz click aquí</a>.</p>
                    <!-- BOTON -->
                </div> 
                <div class="btn-field">
                    <button name="registro" type="submit">Registrate</button>
                </div>
                <p class="warnings" id="warnings"></p>
            </form>
        </div>            
    </section>
    <br><br><br>
